name: Update Docker Hub Description
on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/DockerHub-Description.yml
  # 手动同步（README 未改动但想刷新 Hub 描述时用）
  workflow_dispatch:
jobs:
  dockerHubDescription:
    if: startsWith(github.repository, 'qd-today/ddddocr-docker')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check short description fits Docker Hub's limit
      # Docker Hub 短描述上限是 100 字节（不是字符），超出会被静默截断、页面上看不出来。
      # 中文每字 3 字节，超限一律在这里失败。
      env:
        SHORT: ${{ github.event.repository.description }}
      run: |
        bytes=$(printf '%s' "$SHORT" | wc -c | tr -d ' ')
        echo "短描述 ${bytes} 字节 / 上限 100：${SHORT}"
        if [ "$bytes" -gt 100 ]; then
          echo "::error::Docker Hub 短描述上限 100 字节（中文每字 3 字节），当前 ${bytes} 字节会被截断"
          exit 1
        fi

    - name: Docker Hub Description
      uses: peter-evans/dockerhub-description@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
        repository: a76yyyy/ddddocr
        short-description: ${{ github.event.repository.description }}
