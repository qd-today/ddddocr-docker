name: Exp ARMv7 Src NEON

# 实验：armv7 上把 numpy / onnxruntime 也从源码编译（NEON），验证能否推翻
# 「只给 OpenCV 开 NEON 端到端零收益」的结论（推理占端到端 90%+）。
#
# 流程：
#   1) 拉取已发布的 latest（armv7），跑一次基准 → 基线数字
#   2) 以它为 BASE 构建 experiments/armv7-src-neon.Dockerfile（numpy/ORT 源码版）
#   3) 再跑同一套基准 → 对比
# 构建失败不影响第 1 步的数字，日志会停在某个 STAGE，能直接看出卡在哪。
on:
  workflow_dispatch:
    inputs:
      iters:
        description: '每项测试迭代次数'
        type: string
        default: '30'

jobs:
  exp:
    runs-on: ubuntu-24.04-arm
    name: armv7 src-built numpy+onnxruntime
    timeout-minutes: 355
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native AArch32 execution
        run: |
          docker pull -q --platform linux/arm/v7 a76yyyy/ddddocr:latest
          OUT=$(docker run --rm --platform linux/arm/v7 alpine:3.24 uname -m)
          echo "uname -m = $OUT"
          if [ "$OUT" = "armv7l" ]; then
            echo "::error::检测到 QEMU，基准结果不可信"
            exit 1
          fi

      - name: Benchmark baseline (发布中的 latest)
        env:
          BENCH_ITERS: ${{ github.event.inputs.iters }}
        run: |
          docker run --rm -i -e BENCH_ITERS --platform linux/arm/v7 \
            a76yyyy/ddddocr:latest python3 - < tests/bench.py | tee /tmp/base.txt

      # 用 docker build（docker driver）而不是 buildx container driver：
      # 后者解析 FROM 时只查 registry，拿不到本地已 load 的镜像
      - name: Build src-built variant
        run: |
          docker build --platform linux/arm/v7 \
            -f experiments/armv7-src-neon.Dockerfile \
            --build-arg BASE=a76yyyy/ddddocr:latest \
            -t ddddocr-armv7:src-neon . 2>&1 | tee /tmp/build.txt | tail -n 200

      - name: Benchmark src-built variant
        env:
          BENCH_ITERS: ${{ github.event.inputs.iters }}
        run: |
          docker run --rm -i -e BENCH_ITERS --platform linux/arm/v7 \
            ddddocr-armv7:src-neon python3 - < tests/bench.py | tee /tmp/srcneon.txt

      - name: Compare
        run: |
          python3 - <<'PY'
          import re

          LINE = re.compile(r"^(?P<label>.{30})\s+(?P<ms>\d+\.\d+) ms")

          def parse(path):
              head, data = [], {}
              for raw in open(path, encoding="utf-8"):
                  line = raw.rstrip()
                  if line.startswith(("python ", "OpenCV ")) or "Baseline:" in line:
                      head.append(line)
                  m = LINE.match(line)
                  if m:
                      data[m.group("label").strip()] = float(m.group("ms"))
              return head, data

          b_head, base = parse("/tmp/base.txt")
          s_head, src = parse("/tmp/srcneon.txt")

          print("=== 构建信息 ===")
          print("base:", *b_head, sep="\n  ")
          print("src :", *s_head, sep="\n  ")

          print()
          print("%-32s %12s %12s %8s" % ("项目", "base/ms", "src-neon/ms", "加速比"))
          print("-" * 68)
          for label in base:
              if label in src and src[label]:
                  print("%-32s %12.2f %12.2f %7.2fx"
                        % (label, base[label], src[label], base[label] / src[label]))
          PY

      - name: Show build failure context
        if: failure()
        run: |
          echo "=== 构建日志尾部（看停在哪个 STAGE）==="
          grep -nE "^=== STAGE|Error|error:|ERROR|CMake Error|No such file" /tmp/build.txt | tail -40 || true
