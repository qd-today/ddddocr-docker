name: Build Image

# 薄调用方：真正的流水线在 _image.yml（plan → build → smoke → publish）。
# 这里只做两件事：决定什么时候跑、把 dispatch 的输入原样传下去。
#
# 每个平台产出两个镜像：
#   <ddddocr_version>            可运行镜像（python3 + ddddocr + cv2 + onnxruntime），
#                                滚动 tag latest
#   <ddddocr_version>-wheelhouse wheel 载体镜像（scratch + /wheels），滚动 tag wheelhouse
#
# 只在两种情况下构建：
#   * workflow_dispatch —— 手动触发，默认只构建+冒烟、不发布
#   * tag 推送          —— 正式发布
# 普通 push 到 main 不构建：QEMU 架构一次全量构建以小时计，每次 merge 都跑既费额度
# 也没有额外信息（改动是否可用，dispatch 一次就能验）。
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      push:
        description: '构建并通过冒烟测试后发布到 Docker Hub（不勾选则只构建+冒烟，不发布任何镜像）'
        type: boolean
        default: false
      platforms:
        description: '要构建的平台，逗号分隔不要空格；留空=默认全部 6 个（linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/loong64）。子集构建禁止发布'
        type: string
        default: ''
      apk_mirror:
        description: 'apk 镜像源，如 https://mirrors.tuna.tsinghua.edu.cn（留空=官方源）'
        type: string
        default: ''
      pip_mirror:
        description: 'PyPI 镜像源，如 https://pypi.tuna.tsinghua.edu.cn/simple（留空=官方 PyPI）'
        type: string
        default: ''
      alpine_version:
        description: 'alpine 版本；决定 Python 小版本，进而决定 wheel 的 cpXX tag'
        type: string
        default: '3.24'
      opencv_version:
        description: 'OpenCV 源码版本（自编最小化 wheel：core/imgproc/imgcodecs）'
        type: string
        default: '4.14.0'
      pillow_version:
        description: 'Pillow 源码版本（自编 wheel，不链 libimagequant）'
        type: string
        default: '13.0.0'
      onnx_version:
        description: 'onnxruntime 版本；同时决定用哪个 a76yyyy/onnxruntime:<ver>-wheelhouse'
        type: string
        default: '1.24.4'
      numpy_version:
        description: 'numpy 版本（由 onnxruntime 的 wheelhouse 提供）'
        type: string
        default: '2.4.6'
      dddocr_version:
        description: 'ddddocr 版本（同时是 runtime 镜像的 tag；wheelhouse 镜像为 <ver>-wheelhouse）'
        type: string
        default: '1.6.1'
      dddocr_ref:
        description: 'ddddocr 的 git ref；tag 发布时忽略此项，改用 ddddocr.version 锁定的 commit'
        type: string
        default: 'master'
      native_arm:
        description: '用 GitHub 原生 arm64 runner 构建 arm64（比 QEMU 快一个数量级）；runner 不可用时取消勾选回退 QEMU'
        type: boolean
        default: true
      cache_bust:
        description: '缓存 scope 后缀。留空=复用缓存；填任意值=强制不复用旧层（基准测试用）'
        type: string
        default: ''
jobs:
  image:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      # tag 推送时 github.event.inputs 全是 null，各输入退回 workflow_call 里的默认值
      push: ${{ github.event.inputs.push == 'true' }}
      platforms: ${{ github.event.inputs.platforms || '' }}
      apk_mirror: ${{ github.event.inputs.apk_mirror || '' }}
      pip_mirror: ${{ github.event.inputs.pip_mirror || '' }}
      alpine_version: ${{ github.event.inputs.alpine_version || '3.24' }}
      opencv_version: ${{ github.event.inputs.opencv_version || '4.14.0' }}
      pillow_version: ${{ github.event.inputs.pillow_version || '13.0.0' }}
      onnx_version: ${{ github.event.inputs.onnx_version || '1.24.4' }}
      numpy_version: ${{ github.event.inputs.numpy_version || '2.4.6' }}
      dddocr_version: ${{ github.event.inputs.dddocr_version || '1.6.1' }}
      dddocr_ref: ${{ github.event.inputs.dddocr_ref || 'master' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      cache_bust: ${{ github.event.inputs.cache_bust || '' }}
